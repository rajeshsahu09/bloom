<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bloom — Pregnancy Calendar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#fbf6f4;--card:#fff;--ink:#2b2226;--mut:#7b6f74;--line:#efe4e4;--t1:#b4546e;--t1s:#f8e8ed;--t2:#5f8a74;--t2s:#e4efe9;--t3:#b9822c;--t3s:#f8eedb;--sh:0 14px 36px rgba(90,50,64,.08);--serif:Fraunces,Georgia,serif;--sans:Inter,system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171214;--card:#211a1d;--ink:#f3eaee;--mut:#a99ca2;--line:#382e33;--t1:#e48ba4;--t1s:#3a2630;--t2:#9dc7b0;--t2s:#223029;--t3:#e6b560;--t3s:#38301f;--sh:0 14px 36px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--bg:#171214;--card:#211a1d;--ink:#f3eaee;--mut:#a99ca2;--line:#382e33;--t1:#e48ba4;--t1s:#3a2630;--t2:#9dc7b0;--t2s:#223029;--t3:#e6b560;--t3s:#38301f;--sh:0 14px 36px rgba(0,0,0,.45)}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;min-height:100%;background:radial-gradient(60% 40% at 0 0,var(--t1s),transparent),radial-gradient(50% 35% at 100% 30%,var(--t2s),transparent),radial-gradient(50% 30% at 0 90%,var(--t3s),transparent),var(--bg);background-attachment:fixed;color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input{font:inherit;color:inherit}button{cursor:pointer}[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--t1);outline-offset:2px}
.shell{width:min(940px,92%);margin-inline:auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;height:56px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{height:100%;display:flex;align-items:center;justify-content:space-between}
.brand{font:600 1.4rem var(--serif);letter-spacing:-.02em}.brand i{color:var(--t1);font-style:normal}
.act{display:flex;gap:8px}
.pill{height:34px;padding:0 13px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--mut);font-size:.8rem;font-weight:600}
.pill:hover{color:var(--ink);border-color:var(--t1)}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:var(--sh)}
h3{font:400 1.2rem var(--serif);margin:0}
/* landing */
.land{min-height:calc(100svh - 120px);display:grid;place-content:center;text-align:center;gap:26px;padding:20px 0}
.land h1{font:400 clamp(3rem,13vw,6rem)/.95 var(--serif);letter-spacing:-.04em;margin:0}
.land h1 em{color:var(--t1)}
.flower{font-size:3.4rem;animation:sway 4s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(6deg) scale(1.06)}}
.form{width:min(420px,92vw);margin:auto;padding:14px;display:grid;gap:10px;text-align:left}
.form label{font-size:.82rem;font-weight:600;padding:2px 4px}
input[type=date]{height:50px;width:100%;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg);font-size:16px}
.go{height:50px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--t1),var(--t3));color:#fff;font-weight:700;letter-spacing:.01em}
.go:active{transform:scale(.98)}
#err{margin:0;padding:0 4px;color:var(--t1);font-size:.8rem;font-weight:600;min-height:1.2em}
body.has .land{display:none}
/* app */
#app{display:grid;gap:16px;padding:16px 0 40px}

.ringbox{position:relative;width:250px;height:250px;margin:auto}
.ringbox svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.rbg{fill:none;stroke:var(--line);stroke-width:9}
.rfg{fill:none;stroke:url(#g);stroke-width:9;stroke-linecap:round;stroke-dasharray:578.05;stroke-dashoffset:578.05;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.fruit{width:140px;height:140px;margin:0 auto;display:grid;place-items:center;font-size:5.6rem;line-height:1;transition:transform .4s cubic-bezier(.3,1.5,.5,1)}.ringbox #unit{position:absolute;top:2px;right:-6px;z-index:2;height:28px;padding:0 10px;font-size:.72rem}
.fruit svg{position:static;transform:none;width:92px;height:92px}
.fruit.pop{transform:scale(1.15) rotate(-6deg)}
.age{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.age b{font:400 3.2rem/1 var(--serif);letter-spacing:-.04em}#age b{display:block;font:400 2.5rem/1 var(--serif);letter-spacing:-.04em}#age span{display:block;color:var(--mut);font-size:.85rem;font-weight:600;margin:4px 0 0}.age .bn{font:400 1.1rem/1.2 var(--serif);color:var(--t1);margin-top:8px}
.age span{color:var(--mut);font-weight:600;font-size:.8rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.chip{padding:5px 12px;border-radius:99px;font-size:.78rem;font-weight:700;background:var(--t1s);color:var(--t1)}
.chip.m{background:var(--t2s);color:var(--t2)}.chip.d{background:var(--t3s);color:var(--t3)}
.stats{margin-bottom:2px}

.stats small{display:block;color:var(--mut);font-size:.7rem;font-weight:600}.stats b{display:block;font:400 1.35rem/1.15 var(--serif)}
.bar{position:relative;height:8px;border-radius:9px;margin-top:16px;background:linear-gradient(90deg,var(--t1s) 35%,var(--t2s) 35% 70%,var(--t3s) 70%)}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:9px;background:linear-gradient(90deg,var(--t1),var(--t2) 50%,var(--t3));transition:width .5s}
.back{margin-top:12px;border:0;background:none;color:var(--t1);font-weight:700;font-size:.82rem;padding:4px 0}
/* weeks */
.grp{overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px}.mt{margin-top:2px}.dev{text-align:center}.info{text-align:center;margin-top:6px;display:grid;grid-template-columns:1fr 1fr;gap:0 12px;align-items:center}.info .chips,.info .bar{grid-column:1/-1}.mt,.dev,.info{width:100%;max-width:460px}.chips{justify-content:center}.weeks{position:relative;display:flex;gap:6px;overflow-x:auto;padding:14px;scrollbar-width:none;scroll-behavior:smooth}
.weeks::-webkit-scrollbar{display:none}
.wk{flex:0 0 auto;width:46px;height:56px;border:1px solid var(--line);border-radius:14px;background:var(--bg);display:grid;place-content:center;text-align:center;line-height:1.1;color:var(--mut);transition:transform .15s}
.wk small{font-size:.56rem;font-weight:600;text-transform:uppercase}.wk b{font-size:1rem;color:var(--ink)}
.wk.p1{background:var(--t1s)}.wk.p2{background:var(--t2s)}.wk.p3{background:var(--t3s)}
.wk:hover{transform:translateY(-2px)}
.wk.on{background:var(--ink);border-color:var(--ink)}.wk.on b,.wk.on small{color:var(--bg)}
.wk.now{box-shadow:0 0 0 2px var(--t1)}
/* baby */
.baby{padding:22px;display:grid;gap:14px}
.bh{display:flex;align-items:center;gap:14px}.bt{display:flex;justify-content:space-between;align-items:center;gap:8px}.bt .pill{height:26px;padding:0 10px;font-size:.7rem}.bi{flex:1;min-width:0}.bi small{color:var(--t1);font-weight:700;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em}
.bn{font:400 1.8rem/1.1 var(--serif);text-align:center;color:var(--t1)}
.dev{margin:0;padding:12px 14px;border-radius:14px;background:var(--t1s);font-size:.9rem}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mt div{padding:10px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);display:flex;align-items:center;gap:10px}.mt .mi{font-size:1.3rem}
.mt small{display:block;color:var(--mut);font-size:.72rem;font-weight:600}.mt b{display:block;font-size:1.15rem}
/* calendar */
.cal{overflow:hidden}
.ch{display:flex;align-items:center;justify-content:space-between;padding:14px}
.ch button{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:none;color:var(--mut);font-size:1.2rem}.cn{display:flex;gap:6px;align-items:center}.ch .tdy{width:auto;padding:0 14px;border-radius:99px;font-size:.78rem;font-weight:700;color:var(--t1);border-color:var(--t1);background:var(--t1s)}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 10px}
.dow{text-align:center;font-size:.7rem;font-weight:700;color:var(--mut);padding-bottom:6px}
.days{padding-bottom:12px;touch-action:pan-y;user-select:none}
.day{position:relative;min-height:54px;padding:5px;text-align:left;border:1px solid transparent;border-radius:12px;background:var(--bg);transition:transform .15s}
.day b{font-size:.85rem}.day small{display:block;font-size:.58rem;font-weight:700;color:var(--mut)}
.day.t1{background:var(--t1s)}.day.t2{background:var(--t2s)}.day.t3{background:var(--t3s)}
.day.out{background:none;opacity:.25;cursor:default}
.day:not(.out):hover{transform:translateY(-2px);border-color:var(--ink)}
.day.today{box-shadow:inset 0 0 0 2px var(--ink)}
.day.sel{background:var(--ink);color:var(--bg)}.day.sel small{color:var(--bg)}
.day em{position:absolute;top:4px;right:4px;font:700 .5rem var(--sans);font-style:normal;padding:1px 4px;border-radius:9px;background:var(--card);color:var(--t1)}
.day i{position:absolute;bottom:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--t3)}
.mon{position:relative;display:flex;gap:6px;overflow-x:auto;padding:12px 14px;border-top:1px solid var(--line);scrollbar-width:none;scroll-behavior:smooth}
.mon::-webkit-scrollbar{display:none}
.mon button{flex:0 0 auto;padding:7px 13px;border:1px solid var(--line);border-radius:99px;background:none;font-size:.8rem;color:var(--mut)}
.mon button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* timeline */
.tl{padding:22px}
.tll{list-style:none;margin:14px 0 0;padding:0 0 0 16px;border-left:2px solid var(--line);display:grid;gap:8px}
.it{position:relative;width:100%;text-align:left;padding:12px 64px 12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--bg);display:flex;align-items:center;gap:12px;transition:transform .15s}.it:hover{transform:translateX(3px)}
.it::before{content:"";position:absolute;left:-25px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--card);border:3px solid var(--mut)}
.it:hover{border-color:var(--t1)}
.it.now{background:var(--t1s);border-color:var(--t1)}.it.now::before{border-color:var(--t1);background:var(--t1)}
.it.done{opacity:.6}.it.done::before{border-color:var(--t2);background:var(--t2)}
.it b,.it span{display:block}.it b{font-size:.92rem}.it span{font-size:.78rem;color:var(--mut)}.it .ic{flex:0 0 auto;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--card);font-style:normal;font-size:1.25rem}
.it u{position:absolute;right:12px;top:12px;text-decoration:none;font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--card);color:var(--mut)}
.it.now u{color:var(--t1)}
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.bd{position:absolute;inset:0;background:rgba(20,10,15,.5);backdrop-filter:blur(6px);opacity:0;transition:opacity .25s}
.pn{position:relative;width:min(520px,100%);max-height:90svh;overflow:auto;border-radius:30px 30px 0 0;background:var(--card);box-shadow:0 -20px 60px rgba(0,0,0,.3);transform:translateY(100%);transition:transform .34s cubic-bezier(.2,.9,.25,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.open .bd{opacity:1}.sheet.open .pn{transform:none}
@media(min-width:700px){.sheet{align-items:center}.pn{border-radius:30px;transform:translateY(30px) scale(.96);opacity:0;transition:transform .3s,opacity .25s}.sheet.open .pn{opacity:1;transform:none}}
.ph{position:relative;padding:26px 24px 22px;background:linear-gradient(135deg,var(--t1s),var(--t3s) 70%,var(--t2s))}
.ph>i{display:grid;place-items:center;width:64px;height:64px;border-radius:20px;background:var(--card);font-style:normal;font-size:2rem;box-shadow:var(--sh)}
.ph h4{font:400 1.7rem/1.15 var(--serif);margin:14px 0 4px}.ph span{color:var(--mut);font-size:.85rem;font-weight:500}
.x{position:absolute;top:14px;right:14px;width:34px;height:34px;border:0;border-radius:50%;background:var(--card);color:var(--mut)}
.sc{display:inline-block;margin:0 0 10px;padding:3px 10px;border-radius:99px;background:var(--card);font-size:.72rem;font-weight:700;color:var(--mut)}
.ph .sc{display:block;width:max-content;margin-top:14px}
.sc.now{color:var(--t1)}.sc.done{color:var(--t2)}
.pb{padding:20px 24px 24px;display:grid;gap:14px}
.pr{height:6px;border-radius:9px;background:var(--line);overflow:hidden}.pr i{display:block;height:100%;background:linear-gradient(90deg,var(--t1),var(--t3));border-radius:9px}
.pb p{margin:0}.pb h5{margin:0;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.pb ul{list-style:none;margin:-4px 0 0;padding:0;display:grid;gap:6px}
.ck{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:left;font-size:.88rem}
.ck i{flex:0 0 auto;width:20px;height:20px;border-radius:7px;border:2px solid var(--mut);display:grid;place-items:center;font-size:.7rem;color:#fff}
.ck.on{color:var(--mut);text-decoration:line-through}.ck.on i{background:var(--t2);border-color:var(--t2)}.ck.on i::after{content:"✓"}
.pa{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin-top:4px}.pa .pill{height:50px;border-radius:14px}.pa .go{display:grid;place-items:center;text-decoration:none}
.foot{text-align:center;color:var(--mut);font-size:.72rem}
@media(max-width:680px){.grp{padding:20px}.chips{justify-content:center}.ringbox{width:250px;height:250px}.day{min-height:48px;padding:4px 3px}.day em{font-size:.44rem;padding:1px 3px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="shell nav"><span class="brand">bloom<i>•</i></span><div class="act"><button class="pill" id="chg" hidden>Change LMP</button><button class="pill" id="thm" aria-label="Toggle theme">🌙</button></div></div></header>
<main class="shell">
<section class="land">
  <div class="flower">🌸</div>
  <h1>Meet your<br><em>due date.</em></h1>
  <div class="card form">
    <label for="lmp">First day of last menstrual period</label>
    <input id="lmp" type="date">
    <button class="go" id="go">Show my pregnancy</button>
    <p id="err"></p>
  </div>
</section>
<div id="app" hidden>
  <section class="card grp">
    <div class="ringbox">
      <svg viewBox="0 0 212 212"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9708c"/><stop offset=".55" stop-color="#7fae95"/><stop offset="1" stop-color="#d4a04a"/></linearGradient></defs><circle class="rbg" cx="106" cy="106" r="92"/><circle class="rfg" id="rfg" cx="106" cy="106" r="92"/></svg>
      <div class="age"><div class="fruit" id="fruit"></div></div>
      <button class="pill" id="unit">cm / g</button>
    </div>
    <div class="bn" id="bn"></div><small id="bw" hidden></small>
    <div class="mt"><div><span class="mi">📏</span><span><small id="lenL">Length</small><b id="len"></b></span></div><div><span class="mi">⚖️</span><span><small>Weight</small><b id="wt"></b></span></div></div>
    <p class="dev" id="dev"></p>
    <div class="info">
      <div id="age"></div>
      <div class="stats"><small>Estimated due date</small><b id="edd"></b></div>
      <div class="chips" id="chips"></div>
      <div class="bar"><i id="fill"></i></div>
    </div>
  </section>
  <section class="card weeks" id="weeks" aria-label="Weeks"></section>
  <section class="card cal">
    <div class="ch"><h3 id="ct"></h3><div class="cn"><button class="tdy" id="back" hidden>Today</button><button id="prev" aria-label="Previous month">‹</button><button id="next" aria-label="Next month">›</button></div></div>
    <div class="dow"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
    <div class="days" id="days"></div>
    <div class="mon" id="mon"></div>
  </section>
  <section class="card tl"><h3>Care windows</h3><ul class="tll" id="tl"></ul></section>
  <div class="foot">Care windows follow ICMR/MoHFW guidance and common Indian practice. Educational only; your clinician may adjust them.</div>
</div>
</main>
<div class="sheet" id="sheet" hidden><div class="bd" id="bd"></div><div class="pn" id="pn" role="dialog" aria-modal="true"></div></div>
<script>

const CARE=[
["Dating scan","6w–9w",42,69,"📡","Confirms the heartbeat, number of babies and your due date. Best done between 6 and 9 weeks.",["Ask if a full bladder is needed"]],
["Booking visit (ANC 1)","By 12w",42,83,"🩺","Register your pregnancy early. Essential tests are haemoglobin, urine and blood group with Rh. Syphilis, HIV and hepatitis B tests and a first diabetes test are also advised.",["Haemoglobin, urine, ABO & Rh","VDRL/RPR, HIV, HBsAg","First diabetes test (DIPSI/OGTT)"]],
["Td dose 1","Early pregnancy",42,83,"💉","Tetanus toxoid (Td) is given early in pregnancy. If you were fully immunised within the last 3 years, one booster dose is enough.",["Carry your immunisation record"]],
["Level 1 scan (NT)","11w–13w6d",77,97,"📡","The first-trimester scan measures nuchal translucency and checks early anatomy, usually alongside a blood test. Names vary by clinic.",["Ask about the paired blood test"]],
["ANC visit 2","14w–26w",98,181,"📋","Second minimum check-up: weight, BP, fundal height and haemoglobin. Free check-ups run on the 9th of each month at government facilities (PMSMA).",["Ask about your haemoglobin"]],
["Td dose 2","14w–26w",98,181,"💉","The second tetanus dose, given at least 4 weeks after the first.",["Keep a 4+ week gap"]],
["Quad test (optional)","15w–22w6d",105,160,"🔬","An optional blood screening test, offered where counselling is available.",["Ask for counselling first"]],
["Level 2 scan (anomaly)","18w–22w",126,154,"🫧","A detailed anomaly scan (TIFFA) checking the baby’s organs, spine and limbs, plus the placenta. National guidance lists 18–20 weeks.",["Book it ahead"]],
["Diabetes test (DIPSI)","24w–28w6d",168,202,"🍬","Repeat the glucose test after 24 weeks, at least 4 weeks after the first one. DIPSI uses a single 75 g glucose drink.",["Ask if fasting is needed"]],
["ANC visit 3","28w–34w",196,238,"📋","Third minimum check-up: BP, haemoglobin, urine albumin, fundal height and baby’s heartbeat.",["Learn the danger signs","Discuss your birth plan"]],
["Level 3 scan (growth)","28w–32w",196,224,"📈","A third-trimester growth scan checks baby’s size, fluid and placenta. Timing and naming vary by clinic.",["Ask if Doppler is needed"]],
["Baby shower","28w–31w6d",196,223,"🎀","A comfortable window before travel gets harder. Send invites 3–4 weeks ahead.",["Pick a date and venue"]],
["Hospital bag & plan","34w–36w6d",238,258,"🧳","Pack your bag, choose your delivery facility and plan transport while you still have energy.",["Pack ID and health records","Plan transport","Save emergency numbers"]],
["ANC visit 4","36w+",252,280,"📋","Final minimum check-up: confirm where you will deliver, how you will get there and which danger signs need immediate care.",["Confirm the delivery facility","Arrange transport"]],
["Term (37w+)","37w–40w",259,280,"🎉","From 37 completed weeks a baby is considered term. Due dates are estimates, so keep your bag ready and watch for labour signs.",["Know the signs of labour"]]];
const MS=[0,35,63,98,126,161,196,224,252];
const LBL={0:"LMP",98:"T2",196:"T3",259:"Term",280:"EDD"};
let lmp,edd,sel,view,imp=st.g("bloom-unit")==="imp";
const U=d=>new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()));
const today=()=>{const n=new Date();return new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()))};
const add=(d,n)=>{const x=U(d);x.setUTCDate(x.getUTCDate()+n);return x};
const diff=(a,b)=>Math.round((U(b)-U(a))/864e5);
const same=(a,b)=>U(a).getTime()===U(b).getTime();
const parse=s=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(s||""))return null;const[y,m,d]=s.split("-").map(Number),t=new Date(Date.UTC(y,m-1,d));return t.getUTCMonth()===m-1&&t.getUTCDate()===d?t:null};
const iso=d=>d.toISOString().slice(0,10);
const fmt=(d,o={month:"short",day:"numeric",year:"numeric"})=>new Intl.DateTimeFormat(undefined,{...o,timeZone:"UTC"}).format(d);
const inW=d=>d>=lmp&&d<=edd;
function info(d){const s=Math.max(0,Math.min(280,diff(lmp,d)));let m=0;for(let i=8;i>=0;i--)if(s>=MS[i]){m=i;break}
return{s,w:Math.floor(s/7),d:s%7,m,tri:s<98?1:s<196?2:3}}
// theme
const dark=()=>{const t=document.documentElement.dataset.theme;return t?t==="dark":matchMedia("(prefers-color-scheme:dark)").matches};
const th=()=>{$("thm").textContent=dark()?"☀️":"🌙"};
if(["dark","light"].includes(st.g("bloom-theme")))document.documentElement.dataset.theme=st.g("bloom-theme");th();
$("thm").onclick=()=>{const n=dark()?"light":"dark";document.documentElement.dataset.theme=n;st.s("bloom-theme",n);th()};
$("unit").onclick=()=>{imp=!imp;st.s("bloom-unit",imp?"imp":"met");baby(info(sel).w)};
// bounds
const t0=today();$("lmp").max=iso(t0);$("lmp").min=iso(add(t0,-294));

function baby(w){
  const[n,e,l,g]=R[w];
  $("unit").textContent=imp?"in / lb":"cm / g";
  $("bn").textContent=n;$("bw").textContent="Week "+w;$("dev").textContent="✨ "+DEV[w];
  $("lenL").textContent=w>=20?"Height":"Length";
  $("len").textContent=w<4?"—":imp?(l/2.54).toFixed(1)+" in":l.toFixed(1)+" cm";
  const oz=g*.03527396;
  $("wt").textContent=w<4?"—":imp?(oz<16?oz.toFixed(oz<1?2:1)+" oz":Math.floor(oz/16)+" lb "+Math.round(oz%16)+" oz"):g<1000?(g<10?g.toFixed(1):Math.round(g))+" g":(g/1000).toFixed(2)+" kg";
  const f=$("fruit");f.innerHTML=G[n]?svgFruit(n):e;f.classList.add("pop");setTimeout(()=>f.classList.remove("pop"),260);
}
function render(){
  const x=info(sel),t=today();
  $("age").innerHTML=`<b>${x.w}w ${x.d}d</b><span>${fmt(sel,{weekday:"short",month:"short",day:"numeric"})}</span>`;
  const late=x.s===280&&t>edd,left=280-x.s;
  $("chips").innerHTML=`<span class="chip">Trimester ${x.tri}</span><span class="chip m">Month ${x.m+1}</span><span class="chip d">${late?diff(edd,t)+" days past due":x.s===280?"Due date":left+" days to go"}</span>`;
  $("fill").style.width=x.s/280*100+"%";$("rfg").style.strokeDashoffset=578.05*(1-x.s/280);
  
  baby(x.w);
  document.querySelectorAll(".wk").forEach(b=>{const on=+b.dataset.w===x.w;b.classList.toggle("on",on);if(on)$("weeks").scrollTo({left:b.offsetLeft-$("weeks").clientWidth/2+23})});
  document.querySelectorAll("#mon button").forEach(b=>{const on=+b.dataset.m===x.m;b.classList.toggle("on",on);if(on)$("mon").scrollTo({left:b.offsetLeft-$("mon").clientWidth/2+b.offsetWidth/2})});
  cal();
}
function cal(){
  const t=today();$("ct").textContent=fmt(view,{month:"long",year:"numeric"});$("back").hidden=!inW(t)||(same(sel,t)&&view.getUTCMonth()===t.getUTCMonth()&&view.getUTCFullYear()===t.getUTCFullYear());
  const g=$("days");g.innerHTML="";const st0=add(view,-view.getUTCDay());
  for(let i=0;i<42;i++){
    const c=add(st0,i),b=document.createElement("button");b.type="button";
    if(!inW(c)){b.className="day out";b.innerHTML=`<b>${c.getUTCDate()}</b>`;b.disabled=true}
    else{const x=info(c);
      b.className=`day t${x.tri}`+(same(c,sel)?" sel":"")+(same(c,t)?" today":"");
      b.innerHTML=`<b>${c.getUTCDate()}</b>${x.s%7===0&&x.s<280?`<small>${x.w}w</small>`:""}${LBL[x.s]?`<em>${LBL[x.s]}</em>`:""}${CARE.some(r=>r[2]===x.s&&r[2]!==r[3])?"<i></i>":""}`;
      b.setAttribute("aria-label",`${fmt(c)}, ${x.w} weeks ${x.d} days`);
      b.onclick=()=>{sel=c;if(c.getUTCMonth()!==view.getUTCMonth())view=new Date(Date.UTC(c.getUTCFullYear(),c.getUTCMonth(),1));render()};
    }
    g.appendChild(b);
  }
}
function go(d){if(!inW(d))d=d<lmp?lmp:edd;sel=U(d);view=new Date(Date.UTC(sel.getUTCFullYear(),sel.getUTCMonth(),1));render()}
function build(){
  const t=today();
  $("edd").textContent=fmt(edd,{month:"short",day:"numeric",year:"numeric"});
  
  
  $("weeks").innerHTML="";
  for(let w=0;w<=40;w++){const b=document.createElement("button");b.className="wk p"+(w<14?1:w<28?2:3);b.dataset.w=w;b.innerHTML=`<small>Wk</small><b>${w}</b>`;
    if(inW(t)&&info(t).w===w)b.classList.add("now");b.onclick=()=>go(add(lmp,w*7));$("weeks").appendChild(b)}
  $("mon").innerHTML="";
  for(let m=0;m<9;m++){const b=document.createElement("button");b.dataset.m=m;b.textContent="Month "+(m+1);b.onclick=()=>go(add(lmp,MS[m]));$("mon").appendChild(b)}
  $("tl").innerHTML="";
  CARE.forEach((c,i)=>{const[n,w,s,e,ic]=c,ds=add(lmp,s),de=add(lmp,e),b=document.createElement("button");b.className="it";
    const{tag,cl}=stat(c);
    
    if(cl)b.classList.add(cl);
    b.innerHTML=`<i class="ic">${ic}</i><div><b>${n}</b><span>${w} · ${rng(ds,de)}</span></div><u>${tag}</u>`;
    b.onclick=()=>openSheet(i);const li=document.createElement("li");li.appendChild(b);$("tl").appendChild(li)});
}
const rng=(a,b)=>same(a,b)?fmt(a):fmt(a,{month:"short",day:"numeric"})+" – "+fmt(b,{month:"short",day:"numeric"});
function stat(c){const t=today(),ds=add(lmp,c[2]),de=add(lmp,c[3]);if(t>de)return{tag:"Done",cl:"done",txt:"Completed"};if(t>=ds)return{tag:"Now",cl:"now",txt:"Active now"};const a=diff(t,ds);return{tag:a<=60?a+"d":fmt(ds,{month:"short",year:"numeric"}),cl:"",txt:"Starts in "+a+" days"}}
let cur=0,lastF=null;
function openSheet(i){cur=i;lastF=document.activeElement;
const c=CARE[i],[n,w,s,e,ic,about,tips]=c,ds=add(lmp,s),de=add(lmp,e),x=stat(c),len=diff(ds,de)+1,t=today();
const pct=x.cl==="now"?Math.round((diff(ds,t)+1)/len*100):x.cl==="done"?100:0;
const ymd=d=>iso(d).replace(/-/g,"");
const url="https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent("Bloom: "+n)+"&dates="+ymd(ds)+"/"+ymd(add(de,1))+"&details="+encodeURIComponent(about);
$("pn").innerHTML=`<div class="ph"><i>${ic}</i><button class="x" id="x" aria-label="Close">✕</button><small class="sc ${x.cl}">${x.txt}</small><h4>${n}</h4><span>${w} · ${rng(ds,de)}</span></div><div class="pb"><div class="pr"><i style="width:${pct}%"></i></div><p>${about}</p>${tips.length?`<h5>Prepare</h5><ul>${tips.map(k=>`<li><button type="button" class="ck"><i></i>${k}</button></li>`).join("")}</ul>`:""}<div class="pa"><a class="go" href="${url}" target="_blank" rel="noopener">＋ Add to calendar</a><button class="pill" id="sc">Show on calendar</button></div></div>`;
$("sheet").hidden=false;document.body.style.overflow="hidden";void $("pn").offsetWidth;$("sheet").classList.add("open");$("x").focus()}
function closeSheet(){$("sheet").classList.remove("open");document.body.style.overflow="";setTimeout(()=>{if(!$("sheet").classList.contains("open"))$("sheet").hidden=true},260);lastF&&lastF.focus&&lastF.focus()}
function begin(v,scroll){
  const p=parse(v);if(!p)return false;
  lmp=p;edd=add(lmp,280);document.body.classList.add("has");$("app").hidden=false;$("chg").hidden=false;
  build();const t=today();go(inW(t)?t:t<lmp?lmp:edd);
  if(scroll)window.scrollTo({top:0,behavior:"smooth"});return true;
}
$("go").onclick=()=>{
  const v=$("lmp").value,p=parse(v),e=$("err");
  if(!p){e.textContent="Enter a valid date.";return}
  if(p>today()){e.textContent="LMP can’t be in the future.";return}
  if(diff(p,today())>294){e.textContent="That’s over 42 weeks ago.";return}
  e.textContent="";st.s("bloom-lmp",v);begin(v,true);
};
$("lmp").onkeydown=e=>{if(e.key==="Enter")$("go").click()};
$("prev").onclick=()=>{view=new Date(Date.UTC(view.getUTCFullYear(),view.getUTCMonth()-1,1));cal()};
$("next").onclick=()=>{view=new Date(Date.UTC(view.getUTCFullYear(),view.getUTCMonth()+1,1));cal()};
$("back").onclick=()=>go(today());
$("chg").onclick=()=>{document.body.classList.remove("has");$("app").hidden=true;$("chg").hidden=true;$("lmp").focus()};
let sx=0,sy=0;
$("days").addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$("days").addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3)(dx<0?$("next"):$("prev")).click()},{passive:true});
$("days").addEventListener("keydown",e=>{const s={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7}[e.key];if(!s)return;const n=add(sel,s);if(!inW(n))return;e.preventDefault();go(n);const b=$("days").querySelector(".sel");b&&b.focus()});
$("bd").onclick=closeSheet;
$("pn").addEventListener("click",e=>{const k=e.target.closest(".ck");if(k)k.classList.toggle("on");if(e.target.closest("#x"))closeSheet();if(e.target.closest("#sc")){closeSheet();go(add(lmp,CARE[cur][2]));document.querySelector(".cal").scrollIntoView({behavior:"smooth",block:"center"})}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("sheet").hidden)closeSheet()});
const sv=st.g("bloom-lmp");if(sv&&parse(sv)){$("lmp").value=sv;begin(sv,false)}
})();
</script>
</body>
</html>
