<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bloom — Pregnancy Calendar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#fbf6f4;--card:#fff;--ink:#2b2226;--mut:#7b6f74;--line:#efe4e4;
  --t1:#b4546e;--t1s:#f8e8ed;--t2:#5f8a74;--t2s:#e4efe9;--t3:#b9822c;--t3s:#f8eedb;
  --sh:0 14px 36px rgba(90,50,64,.08);
  --sh-pop:0 20px 50px rgba(43,34,38,.18);
  --serif:Fraunces,Georgia,serif;
  --sans:Inter,system-ui,-apple-system,sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#171214;--card:#211a1d;--ink:#f3eaee;--mut:#a99ca2;--line:#382e33;
    --t1:#e48ba4;--t1s:#3a2630;--t2:#9dc7b0;--t2s:#223029;--t3:#e6b560;--t3s:#38301f;
    --sh:0 14px 36px rgba(0,0,0,.45);
    --sh-pop:0 24px 60px rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"]{
  --bg:#171214;--card:#211a1d;--ink:#f3eaee;--mut:#a99ca2;--line:#382e33;
  --t1:#e48ba4;--t1s:#3a2630;--t2:#9dc7b0;--t2s:#223029;--t3:#e6b560;--t3s:#38301f;
  --sh:0 14px 36px rgba(0,0,0,.45);
  --sh-pop:0 24px 60px rgba(0,0,0,.65);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{
  margin:0;min-height:100%;
  background:radial-gradient(60% 40% at 0 0,var(--t1s),transparent),
             radial-gradient(50% 35% at 100% 30%,var(--t2s),transparent),
             radial-gradient(50% 30% at 0 90%,var(--t3s),transparent),var(--bg);
  background-attachment:fixed;color:var(--ink);font:15px/1.5 var(--sans);
  -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input{font:inherit;color:inherit}
button{cursor:pointer}[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--t1);outline-offset:2px}

.shell{width:min(940px,92%);margin-inline:auto}
header{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:15;height:56px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
}
.nav{height:100%;display:flex;align-items:center;justify-content:space-between}
.brand{font:600 1.4rem var(--serif);letter-spacing:-.02em}.brand i{color:var(--t1);font-style:normal}
.act{display:flex;gap:8px;align-items:center}
.pill{
  height:36px;padding:0 14px;border:1px solid var(--line);border-radius:99px;
  background:var(--card);color:var(--mut);font-size:.8rem;font-weight:600;
  transition:border-color .15s,color .15s,background .15s;
}
.pill:hover{color:var(--ink);border-color:var(--t1)}
#thm{
  width:36px;height:36px;padding:0;display:grid;place-items:center;
  font-family:var(--emoji);font-size:1.15rem;line-height:1;
}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:var(--sh)}
h3{font:400 1.2rem var(--serif);margin:0}

/* landing */
.land{min-height:calc(100svh - 120px);display:grid;place-content:center;text-align:center;gap:26px;padding:20px 0}
.land h1{font:400 clamp(3rem,13vw,6rem)/.95 var(--serif);letter-spacing:-.04em;margin:0}
.land h1 em{color:var(--t1)}
.flower{font-family:var(--emoji);font-size:4rem;line-height:1;animation:sway 4s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(6deg) scale(1.06)}}
.form{width:min(420px,92vw);margin:auto;padding:16px;display:grid;gap:10px;text-align:left}
.form label{font-size:.82rem;font-weight:600;padding:2px 4px}
input[type=date]{height:50px;width:100%;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg);font-size:16px}
.go{height:50px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--t1),var(--t3));color:#fff;font-weight:700;letter-spacing:.01em}
.go:active{transform:scale(.98)}
#err{margin:0;padding:0 4px;color:var(--t1);font-size:.8rem;font-weight:600;min-height:1.2em}
body.has .land{display:none}

/* app */
#app{display:grid;gap:16px;padding:16px 0 40px}

/* hero card */
.grp{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px;padding:22px 24px 26px}
.wkwrap{position:relative;width:100%;max-width:460px;z-index:20}
.wkctrl{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:6px;border-radius:99px;background:var(--bg);border:1px solid var(--line);
}
.wkbtn{
  flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
  background:var(--card);color:var(--ink);display:grid;place-items:center;
  box-shadow:0 2px 8px rgba(0,0,0,.05);transition:transform .12s,border-color .15s,color .15s,opacity .15s;
}
.wkbtn:hover:not(:disabled){border-color:var(--t1);color:var(--t1)}
.wkbtn:active:not(:disabled){transform:scale(.94)}
.wkbtn:disabled{opacity:.32;cursor:not-allowed;box-shadow:none}
.wkbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}

.wkmid{
  flex:1;min-width:0;height:44px;border:0;border-radius:99px;background:transparent;
  display:flex;align-items:center;justify-content:center;gap:7px;padding:0 12px;
  transition:background .15s;
}
.wkmid:hover,.wkmid[aria-expanded="true"]{background:color-mix(in srgb,var(--card) 88%,transparent)}
.wkmid b{font:600 1.25rem/1 var(--serif);letter-spacing:-.02em;color:var(--ink)}
.wkmid .wk-sub{font-size:.74rem;font-weight:700;color:var(--mut);padding:3px 8px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.wkmid svg{
  width:16px;height:16px;stroke:var(--mut);fill:none;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;
  transition:transform .2s cubic-bezier(.2,.8,.2,1);
}
.wkmid[aria-expanded="true"] svg{transform:rotate(180deg);stroke:var(--t1)}

/* custom theme-matched week picker popover */
.wkpop{
  position:absolute;top:calc(100% + 10px);left:0;right:0;
  background:var(--card);border:1px solid var(--line);border-radius:24px;
  box-shadow:var(--sh-pop);padding:14px 14px 16px;
  opacity:0;transform:translateY(-8px) scale(.98);pointer-events:none;
  transition:opacity .18s ease,transform .22s cubic-bezier(.2,.9,.25,1);
}
.wkpop.open{opacity:1;transform:none;pointer-events:auto}
.wkpop-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:2px 4px 12px;border-bottom:1px solid var(--line);margin-bottom:12px;
}
.wkpop-prev{display:flex;align-items:center;gap:8px;min-width:0}
.wkpop-prev i{font-family:var(--emoji);font-style:normal;font-size:1.35rem;line-height:1}
.wkpop-prev span{font-size:.86rem;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wkpop-prev small{color:var(--mut);font-weight:600;margin-left:4px}
.wkpop-x{
  flex:0 0 auto;width:30px;height:30px;border:1px solid var(--line);border-radius:50%;
  background:var(--bg);color:var(--mut);font-size:.82rem;display:grid;place-items:center;
}
.wkpop-x:hover{color:var(--ink);border-color:var(--t1)}
.wkpop-body{display:grid;gap:12px;max-height:min(54svh,360px);overflow-y:auto;padding-right:2px}
.wkg-lbl{
  display:flex;align-items:center;justify-content:space-between;
  font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--mut);margin:0 0 6px 2px;
}
.wkg-lbl b{font-weight:700}
.wkg-lbl.t1 b{color:var(--t1)}.wkg-lbl.t2 b{color:var(--t2)}.wkg-lbl.t3 b{color:var(--t3)}
.wkg-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wkp{
  position:relative;height:38px;border:1px solid transparent;border-radius:12px;
  font-size:.84rem;font-weight:700;color:var(--ink);display:grid;place-items:center;
  transition:transform .12s,border-color .15s,background .15s;
}
.wkp.p1{background:var(--t1s)}.wkp.p2{background:var(--t2s)}.wkp.p3{background:var(--t3s)}
.wkp:hover{transform:translateY(-1px);border-color:var(--ink)}
.wkp.now::after{
  content:"";position:absolute;bottom:4px;left:50%;transform:translateX(-50%);
  width:5px;height:5px;border-radius:50%;background:var(--t1);
}
.wkp.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wkp.on.now::after{background:var(--bg)}

.wkjump{
  display:inline-flex;align-items:center;gap:6px;margin-top:-6px;
  height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--t1);
  background:var(--t1s);color:var(--t1);font-size:.76rem;font-weight:700;
  transition:transform .12s,filter .15s;
}
.wkjump:hover{filter:brightness(.97)}
.wkjump:active{transform:scale(.97)}

.ringbox{position:relative;width:254px;height:254px;margin:2px auto 0}
.ringbox > svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.rbg{fill:none;stroke:var(--line);stroke-width:9}
.rfg{
  fill:none;stroke:url(#g);stroke-width:9;stroke-linecap:round;
  stroke-dasharray:578.05;stroke-dashoffset:578.05;
  transition:stroke-dashoffset .45s cubic-bezier(.2,.8,.2,1);
}
.ringbox #unit{
  position:absolute;top:0;right:-10px;z-index:2;height:30px;padding:0 11px;font-size:.74rem;
  box-shadow:0 4px 12px rgba(0,0,0,.06);
}
.age{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.fruit-wrap{
  width:154px;height:154px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 45%,var(--bg) 55%,transparent 75%);
}
.fruit{
  width:136px;height:136px;display:grid;place-items:center;
  font-family:var(--emoji);font-size:6.2rem;line-height:1;
  transition:transform .34s cubic-bezier(.3,1.5,.5,1);
  will-change:transform;user-select:none;
}
.fruit > span{display:inline-block;line-height:1;transform:scale(var(--sc,1))}
.fruit svg{position:static;transform:none;width:116px;height:116px;display:block}
.fruit.pop{transform:scale(1.12) rotate(-4deg)}

.bn-block{text-align:center;margin-top:-4px}
.bn{font:600 1.85rem/1.12 var(--serif);color:var(--t1);letter-spacing:-.02em}
.bn-cap{font-size:.76rem;font-weight:600;color:var(--mut);margin-top:2px}

.mt{width:100%;max-width:460px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt div{
  padding:11px 13px;border-radius:18px;background:var(--bg);border:1px solid var(--line);
  display:flex;align-items:center;gap:11px;
}
.mt .mi{
  flex:0 0 auto;width:42px;height:42px;border-radius:13px;background:var(--card);
  border:1px solid var(--line);display:grid;place-items:center;
  font-family:var(--emoji);font-size:1.5rem;line-height:1;
}
.mt small{display:block;color:var(--mut);font-size:.72rem;font-weight:600}
.mt b{display:block;font-size:1.12rem;line-height:1.2}

.dev{
  width:100%;max-width:460px;margin:0;padding:12px 15px;border-radius:16px;
  background:var(--t1s);font-size:.9rem;display:flex;align-items:flex-start;gap:10px;text-align:left;
}
.dev .di{flex:0 0 auto;font-family:var(--emoji);font-size:1.3rem;line-height:1.25}
.dev span:last-child{flex:1}

.info{
  width:100%;max-width:460px;text-align:center;margin-top:2px;
  display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;align-items:center;
}
.info .chips,.info .scrubber{grid-column:1/-1}
#age b{display:block;font:600 2.3rem/1 var(--serif);letter-spacing:-.03em}
#age span{display:block;color:var(--mut);font-size:.82rem;font-weight:600;margin-top:4px}
.stats small{display:block;color:var(--mut);font-size:.72rem;font-weight:600}
.stats b{display:block;font:600 1.32rem/1.2 var(--serif);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:2px 0}
.chip{padding:5px 12px;border-radius:99px;font-size:.78rem;font-weight:700;background:var(--t1s);color:var(--t1)}
.chip.m{background:var(--t2s);color:var(--t2)}.chip.d{background:var(--t3s);color:var(--t3)}

/* journey timeline progress bar (no manual slider) */
.scrubber{padding-top:6px;text-align:left}
.scrub-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:.72rem;font-weight:700;color:var(--mut)}
.scrub-track{position:relative;height:16px;display:flex;align-items:center}
.scrub-rail{
  position:relative;width:100%;height:10px;border-radius:99px;
  background:linear-gradient(90deg,var(--t1s) 35%,var(--t2s) 35% 70%,var(--t3s) 70%);
  overflow:hidden;
}
.scrub-rail i{
  position:absolute;inset:0 auto 0 0;border-radius:99px;
  background:linear-gradient(90deg,var(--t1),var(--t2) 50%,var(--t3));
  transition:width .35s cubic-bezier(.2,.8,.2,1);
}
.scrub-now{
  position:absolute;top:50%;width:12px;height:12px;border-radius:50%;
  background:var(--card);border:2.5px solid var(--ink);
  transform:translate(-50%,-50%);pointer-events:none;z-index:1;
}
.scrub-marks{display:flex;justify-content:space-between;margin-top:8px;gap:4px}
.scrub-marks button{
  border:0;background:none;padding:3px 6px;border-radius:8px;
  font-size:.7rem;font-weight:700;color:var(--mut);transition:color .15s,background .15s;
}
.scrub-marks button:hover{color:var(--ink);background:var(--bg)}
.scrub-marks button.on{color:var(--t1);background:var(--t1s)}

/* calendar */
.cal{overflow:hidden}
.ch{display:flex;align-items:center;justify-content:space-between;padding:14px}
.ch button{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:none;color:var(--mut);font-size:1.2rem}
.cn{display:flex;gap:6px;align-items:center}
.ch .tdy{width:auto;padding:0 14px;border-radius:99px;font-size:.78rem;font-weight:700;color:var(--t1);border-color:var(--t1);background:var(--t1s)}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 10px}
.dow{text-align:center;font-size:.7rem;font-weight:700;color:var(--mut);padding-bottom:6px}
.days{padding-bottom:12px;touch-action:pan-y;user-select:none}
.day{position:relative;min-height:54px;padding:5px;text-align:left;border:1px solid transparent;border-radius:12px;background:var(--bg);transition:transform .15s}
.day b{font-size:.85rem}.day small{display:block;font-size:.58rem;font-weight:700;color:var(--mut)}
.day.t1{background:var(--t1s)}.day.t2{background:var(--t2s)}.day.t3{background:var(--t3s)}
.day.out{background:none;opacity:.25;cursor:default}
.day:not(.out):hover{transform:translateY(-2px);border-color:var(--ink)}
.day.today{box-shadow:inset 0 0 0 2px var(--ink)}
.day.sel{background:var(--ink);color:var(--bg)}.day.sel small{color:var(--bg)}
.day em{position:absolute;top:4px;right:4px;font:700 .5rem var(--sans);font-style:normal;padding:1px 4px;border-radius:9px;background:var(--card);color:var(--t1)}
.day i{position:absolute;bottom:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--t3)}

/* month strip — properly centered on both wide & narrow screens */
.mon-wrap{position:relative;border-top:1px solid var(--line)}
.mon{
  position:relative;display:flex;align-items:center;gap:6px;
  overflow-x:auto;padding:12px 16px;scrollbar-width:none;
}
.mon::-webkit-scrollbar{display:none}
.mon::before,.mon::after{content:"";flex:1 0 0}
.mon button{
  flex:0 0 auto;padding:7px 14px;border:1px solid var(--line);border-radius:99px;
  background:none;font-size:.8rem;font-weight:600;color:var(--mut);
  transition:background .15s,color .15s,border-color .15s;
}
.mon button:hover{color:var(--ink);border-color:var(--t1)}
.mon button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* timeline */
.tl{padding:22px}
.tll{list-style:none;margin:14px 0 0;padding:0 0 0 16px;border-left:2px solid var(--line);display:grid;gap:8px}
.it{
  position:relative;width:100%;text-align:left;padding:12px 68px 12px 14px;
  border:1px solid var(--line);border-radius:16px;background:var(--bg);
  display:flex;align-items:center;gap:12px;transition:transform .15s,border-color .15s;
}
.it:hover{transform:translateX(3px);border-color:var(--t1)}
.it::before{content:"";position:absolute;left:-25px;top:21px;width:12px;height:12px;border-radius:50%;background:var(--card);border:3px solid var(--mut)}
.it.now{background:var(--t1s);border-color:var(--t1)}.it.now::before{border-color:var(--t1);background:var(--t1)}
.it.done{opacity:.6}.it.done::before{border-color:var(--t2);background:var(--t2)}
.it b,.it span{display:block}.it b{font-size:.92rem}.it span{font-size:.78rem;color:var(--mut)}
.it .ic{
  flex:0 0 auto;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
  background:var(--card);border:1px solid var(--line);
  font-family:var(--emoji);font-style:normal;font-size:1.6rem;line-height:1;
}
.it u{position:absolute;right:12px;top:12px;text-decoration:none;font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--card);color:var(--mut)}
.it.now u{color:var(--t1)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.bd{position:absolute;inset:0;background:rgba(20,10,15,.5);backdrop-filter:blur(6px);opacity:0;transition:opacity .25s}
.pn{
  position:relative;width:min(520px,100%);max-height:90svh;overflow:auto;
  border-radius:30px 30px 0 0;background:var(--card);box-shadow:0 -20px 60px rgba(0,0,0,.3);
  transform:translateY(100%);transition:transform .34s cubic-bezier(.2,.9,.25,1);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.sheet.open .bd{opacity:1}.sheet.open .pn{transform:none}
@media(min-width:700px){
  .sheet{align-items:center}
  .pn{border-radius:30px;transform:translateY(30px) scale(.96);opacity:0;transition:transform .3s,opacity .25s}
  .sheet.open .pn{opacity:1;transform:none}
}
.ph{position:relative;padding:26px 24px 22px;background:linear-gradient(135deg,var(--t1s),var(--t3s) 70%,var(--t2s))}
.ph>i{
  display:grid;place-items:center;width:68px;height:68px;border-radius:22px;
  background:var(--card);font-family:var(--emoji);font-style:normal;font-size:2.4rem;line-height:1;
  box-shadow:var(--sh);
}
.ph h4{font:400 1.7rem/1.15 var(--serif);margin:14px 0 4px}.ph span{color:var(--mut);font-size:.85rem;font-weight:500}
.x{position:absolute;top:14px;right:14px;width:36px;height:36px;border:0;border-radius:50%;background:var(--card);color:var(--mut);font-size:1rem}
.sc{display:inline-block;margin:0 0 10px;padding:3px 10px;border-radius:99px;background:var(--card);font-size:.72rem;font-weight:700;color:var(--mut)}
.ph .sc{display:block;width:max-content;margin-top:14px}
.sc.now{color:var(--t1)}.sc.done{color:var(--t2)}
.pb{padding:20px 24px 24px;display:grid;gap:14px}
.pr{height:6px;border-radius:9px;background:var(--line);overflow:hidden}.pr i{display:block;height:100%;background:linear-gradient(90deg,var(--t1),var(--t3));border-radius:9px}
.pb p{margin:0}.pb h5{margin:0;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.pb ul{list-style:none;margin:-4px 0 0;padding:0;display:grid;gap:6px}
.ck{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:left;font-size:.88rem}
.ck i{flex:0 0 auto;width:20px;height:20px;border-radius:7px;border:2px solid var(--mut);display:grid;place-items:center;font-size:.7rem;color:#fff}

  ["Td dose 1","Early pregnancy",42,83,"💉","Tetanus toxoid (Td) is given early in pregnancy. If you were fully immunised within the last 3 years, one booster dose is enough.",["Carry your immunisation record"]],

const MS=[0,35,63,98,126,161,196,224,252];

const U=d=>new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()));
const today=()=>{const n=new Date();return new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()))};
const add=(d,n)=>{const x=U(d);x.setUTCDate(x.getUTCDate()+n);return x};
const diff=(a,b)=>Math.round((U(b)-U(a))/864e5);
const same=(a,b)=>U(a).getTime()===U(b).getTime();
const parse=s=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(s||""))return null;const[y,m,d]=s.split("-").map(Number),t=new Date(Date.UTC(y,m-1,d));return t.getUTCMonth()===m-1&&t.getUTCDate()===d?t:null};
const iso=d=>d.toISOString().slice(0,10);
const fmt=(d,o={month:"short",day:"numeric",year:"numeric"})=>new Intl.DateTimeFormat(undefined,{...o,timeZone:"UTC"}).format(d);
const inW=d=>d>=lmp&&d<=edd;

function info(d){
  const s=Math.max(0,Math.min(280,diff(lmp,d)));

// theme

const th=()=>{$("thm").textContent=dark()?"☀️":"🌙"};

const t0=today();$("lmp").max=iso(t0);$("lmp").min=iso(add(t0,-294));

function baby(w,force){
  const[n,e,l,g]=R[w];
  $("unit").textContent=imp?"in / lb":"cm / g";
  $("bn").textContent=n;
  $("bw").textContent=w<4?"Early stage":"Size of a "+n.toLowerCase();
  $("dev").textContent=DEV[w];
  $("lenL").textContent=w>=20?"Height":"Length";
  $("len").textContent=w<4?"—":imp?(l/2.54).toFixed(1)+" in":l.toFixed(1)+" cm";
  const oz=g*.03527396;
  $("wt").textContent=w<4?"—":imp?(oz<16?oz.toFixed(oz<1?2:1)+" oz":Math.floor(oz/16)+" lb "+Math.round(oz%16)+" oz"):g<1000?(g<10?g.toFixed(1):Math.round(g))+" g":(g/1000).toFixed(2)+" kg";

  if(w!==lastBabyW||force){
    lastBabyW=w;
    const f=$("fruit");
    if(SVG_FRUITS[n]){
      f.innerHTML=SVG_FRUITS[n];
    }else{
      const sc=EMOJI_SCALE[e]||1;
      f.innerHTML=`<span style="--sc:${sc}">${e}</span>`;
    }
    if(!force){
      clearTimeout(popTimer);
      f.classList.remove("pop");
      void f.offsetWidth;
      f.classList.add("pop");
      popTimer=setTimeout(()=>f.classList.remove("pop"),240);
    }
  }
}

function setPopPreview(w){

}

function openWkPop(){

  setPopPreview(w);
  $("wkPop").hidden=false;
  $("wkToggle").setAttribute("aria-expanded","true");
  requestAnimationFrame(()=>$("wkPop").classList.add("open"));
}
function closeWkPop(){
  if(!popOpen)return;
  popOpen=false;
  $("wkPop").classList.remove("open");
  $("wkToggle").setAttribute("aria-expanded","false");
  setTimeout(()=>{if(!popOpen)$("wkPop").hidden=true},200);
}

function centerMon(activeMonthIdx,instant){
  const mon=$("mon");
  const btns=mon.querySelectorAll("button");
  let activeBtn=null;
  btns.forEach(b=>{
    const on=+b.dataset.m===activeMonthIdx;
    b.classList.toggle("on",on);
    if(on)activeBtn=b;
  });
  if(!activeBtn)return;
  requestAnimationFrame(()=>{
    const maxScroll=mon.scrollWidth-mon.clientWidth;
    if(maxScroll<=0)return;
    const mr=mon.getBoundingClientRect();
    const br=activeBtn.getBoundingClientRect();
    if(!mr.width)return;
    const delta=(br.left+br.width/2)-(mr.left+mr.width/2);
    const target=Math.max(0,Math.min(maxScroll,mon.scrollLeft+delta));
    mon.scrollTo({left:target,behavior:instant?"auto":"smooth"});
  });
}

function displayMonthIdx(){
  if(sel.getUTCFullYear()===view.getUTCFullYear()&&sel.getUTCMonth()===view.getUTCMonth()){
    return info(sel).m;
  }
  const mid=new Date(Date.UTC(view.getUTCFullYear(),view.getUTCMonth(),15));
  const clamped=mid<lmp?lmp:mid>edd?edd:mid;
  return info(clamped).m;
}

function render(opts={}){
  const x=info(sel),t=today(),pct=Math.round(x.s/280*100);

  $("wkTitle").textContent="Week "+x.w;
  $("wkTri").textContent="T"+x.tri;
  $("wkPrev").disabled=x.w<=0;
  $("wkNext").disabled=x.w>=40;

  document.querySelectorAll("#wkPopBody .wkp").forEach(b=>{
    b.classList.toggle("on",+b.dataset.w===x.w);
  });
  if(popOpen)setPopPreview(x.w);

  const hasToday=inW(t),todayW=hasToday?info(t).w:null;
  const wkToday=$("wkToday");
  if(hasToday&&x.w!==todayW){
    wkToday.hidden=false;
    wkToday.textContent=`↩ Back to Week ${todayW} (Today)`;
  }else{
    wkToday.hidden=true;
  }

  $("pctLbl").textContent=pct+"% complete";
  $("fill").style.width=(x.s/280*100)+"%";
  $("rfg").style.strokeDashoffset=578.05*(1-x.s/280);
  const sn=$("scrubNow");
  if(hasToday){sn.hidden=false;sn.style.left=(info(t).s/280*100)+"%"}else{sn.hidden=true}
  document.querySelectorAll("#scrubMarks button").forEach(b=>{
    const mw=+b.dataset.w;
    const active=(mw===0&&x.w<14)||(mw===14&&x.w>=14&&x.w<28)||(mw===28&&x.w>=28&&x.w<40)||(mw===40&&x.w===40);
    b.classList.toggle("on",active);
  });

  $("age").innerHTML=`<b>${x.w}w ${x.d}d</b><span>${fmt(sel,{weekday:"short",month:"short",day:"numeric"})}</span>`;
  const late=x.s===280&&t>edd,left=280-x.s;
  $("chips").innerHTML=`<span class="chip">Trimester ${x.tri}</span><span class="chip m">Month ${x.m+1}</span><span class="chip d">${late?diff(edd,t)+" days past due":x.s===280?"Due date":left+" days to go"}</span>`;

  baby(x.w,false);
  cal(!!opts.instantMon);
}

function cal(instantMon=false){
  const t=today();
  $("ct").textContent=fmt(view,{month:"long",year:"numeric"});
  $("back").hidden=!inW(t)||(same(sel,t)&&view.getUTCMonth()===t.getUTCMonth()&&view.getUTCFullYear()===t.getUTCFullYear());
  const g=$("days");g.innerHTML="";
  const st0=add(view,-view.getUTCDay());
  for(let i=0;i<42;i++){
    const c=add(st0,i),b=document.createElement("button");b.type="button";
    if(!inW(c)){b.className="day out";b.innerHTML=`<b>${c.getUTCDate()}</b>`;b.disabled=true}
    else{
      const x=info(c);
      b.className=`day t${x.tri}`+(same(c,sel)?" sel":"")+(same(c,t)?" today":"");
      b.innerHTML=`<b>${c.getUTCDate()}</b>${x.s%7===0&&x.s<280?`<small>${x.w}w</small>`:""}${LBL[x.s]?`<em>${LBL[x.s]}</em>`:""}${CARE.some(r=>r[2]===x.s&&r[2]!==r[3])?"<i></i>":""}`;
      b.setAttribute("aria-label",`${fmt(c)}, ${x.w} weeks ${x.d} days`);
      b.onclick=()=>{sel=c;if(c.getUTCMonth()!==view.getUTCMonth())view=new Date(Date.UTC(c.getUTCFullYear(),c.getUTCMonth(),1));render()};
    }
    g.appendChild(b);
  }
  centerMon(displayMonthIdx(),instantMon);
}

function go(d,opts={}){
  if(!inW(d))d=d<lmp?lmp:edd;
  sel=U(d);
  view=new Date(Date.UTC(sel.getUTCFullYear(),sel.getUTCMonth(),1));
  render(opts);
}

function goWeek(w,opts={}){
  const clamped=Math.max(0,Math.min(40,w));
  go(add(lmp,clamped*7),opts);
}

function build(){
  const t=today();
  $("edd").textContent=fmt(edd,{month:"short",day:"numeric",year:"numeric"});

  const wb=$("wkPopBody");wb.innerHTML="";
  const todayW=inW(t)?info(t).w:-1;
  const groups=[
    {cls:"t1",p:"p1",title:"Trimester 1",range:"Weeks 0–13",s:0,e:13},
    {cls:"t2",p:"p2",title:"Trimester 2",range:"Weeks 14–27",s:14,e:27},
    {cls:"t3",p:"p3",title:"Trimester 3",range:"Weeks 28–40",s:28,e:40}
  ];
  groups.forEach(gr=>{
    const sec=document.createElement("div");
    sec.innerHTML=`<div class="wkg-lbl ${gr.cls}"><b>${gr.title}</b><span>${gr.range}</span></div>`;
    const grid=document.createElement("div");
    grid.className="wkg-grid";
    for(let w=gr.s;w<=gr.e;w++){
      const b=document.createElement("button");
      b.type="button";
      b.className=`wkp ${gr.p}`+(w===todayW?" now":"");
      b.dataset.w=w;
      b.textContent=w;
      b.setAttribute("aria-label",`Week ${w}, ${R[w][0]}${w===todayW?" (Today)":""}`);
      b.onmouseenter=()=>setPopPreview(w);
      b.onfocus=()=>setPopPreview(w);
      b.onclick=()=>{goWeek(w);closeWkPop()};
      grid.appendChild(b);
    }
    sec.appendChild(grid);
    wb.appendChild(sec);
  });

  $("mon").innerHTML="";
  for(let m=0;m<9;m++){
    const b=document.createElement("button");
    b.type="button";
    b.dataset.m=m;b.textContent="Month "+(m+1);
    b.onclick=()=>go(add(lmp,MS[m]));
    $("mon").appendChild(b);
  }

  $("tl").innerHTML="";
  CARE.forEach((c,i)=>{
    const[n,w,s,e,ic]=c,ds=add(lmp,s),de=add(lmp,e),b=document.createElement("button");
    b.className="it";
    const{tag,cl}=stat(c);
    if(cl)b.classList.add(cl);
    b.innerHTML=`<i class="ic" aria-hidden="true">${ic}</i><div><b>${n}</b><span>${w} · ${rng(ds,de)}</span></div><u>${tag}</u>`;
    b.onclick=()=>openSheet(i);
    const li=document.createElement("li");li.appendChild(b);$("tl").appendChild(li);
  });
}

const rng=(a,b)=>same(a,b)?fmt(a):fmt(a,{month:"short",day:"numeric"})+" – "+fmt(b,{month:"short",day:"numeric"});
function stat(c){
  const t=today(),ds=add(lmp,c[2]),de=add(lmp,c[3]);
  if(t>de)return{tag:"Done",cl:"done",txt:"Completed"};
  if(t>=ds)return{tag:"Now",cl:"now",txt:"Active now"};
  const a=diff(t,ds);
  return{tag:a<=60?a+"d":fmt(ds,{month:"short",year:"numeric"}),cl:"",txt:"Starts in "+a+" days"};
}

let cur=0,lastF=null;
function openSheet(i){
  cur=i;lastF=document.activeElement;
  const c=CARE[i],[n,w,s,e,ic,about,tips]=c,ds=add(lmp,s),de=add(lmp,e),x=stat(c),len=diff(ds,de)+1,t=today();
  const pct=x.cl==="now"?Math.round((diff(ds,t)+1)/len*100):x.cl==="done"?100:0;
  const ymd=d=>iso(d).replace(/-/g,"");
  const url="https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent("Bloom: "+n)+"&dates="+ymd(ds)+"/"+ymd(add(de,1))+"&details="+encodeURIComponent(about);
  $("pn").innerHTML=`<div class="ph"><i aria-hidden="true">${ic}</i><button class="x" id="x" aria-label="Close">✕</button><small class="sc ${x.cl}">${x.txt}</small><h4>${n}</h4><span>${w} · ${rng(ds,de)}</span></div><div class="pb"><div class="pr"><i style="width:${pct}%"></i></div><p>${about}</p>${tips.length?`<h5>Prepare</h5><ul>${tips.map(k=>`<li><button type="button" class="ck"><i></i>${k}</button></li>`).join("")}</ul>`:""}<div class="pa"><a class="go" href="${url}" target="_blank" rel="noopener">＋ Add to calendar</a><button class="pill" id="sc">Show on calendar</button></div></div>`;
  $("sheet").hidden=false;document.body.style.overflow="hidden";
  void $("pn").offsetWidth;$("sheet").classList.add("open");$("x").focus();
}
function closeSheet(){
  $("sheet").classList.remove("open");document.body.style.overflow="";
  setTimeout(()=>{if(!$("sheet").classList.contains("open"))$("sheet").hidden=true},260);
  lastF&&lastF.focus&&lastF.focus();
}

function begin(v,scroll){
  const p=parse(v);if(!p)return false;
  lmp=p;edd=add(lmp,280);lastBabyW=-1;
  document.body.classList.add("has");$("app").hidden=false;$("chg").hidden=false;
  build();
  const t=today();
  go(inW(t)?t:t<lmp?lmp:edd,{instantMon:true});
  if(scroll)window.scrollTo({top:0,behavior:"smooth"});
  return true;
}

$("go").onclick=()=>{
  const v=$("lmp").value,p=parse(v),e=$("err");
  if(!p){e.textContent="Enter a valid date.";return}
  if(p>today()){e.textContent="LMP can’t be in the future.";return}
  if(diff(p,today())>294){e.textContent="That’s over 42 weeks ago.";return}
  e.textContent="";st.s("bloom-lmp",v);begin(v,true);
};
$("lmp").onkeydown=e=>{if(e.key==="Enter")$("go").click()};

$("wkPrev").onclick=()=>{closeWkPop();goWeek(info(sel).w-1)};
$("wkNext").onclick=()=>{closeWkPop();goWeek(info(sel).w+1)};
$("wkToggle").onclick=()=>popOpen?closeWkPop():openWkPop();
$("wkClose").onclick=closeWkPop;
$("wkToday").onclick=()=>{closeWkPop();go(today())};

$("scrubMarks").addEventListener("click",e=>{
  const b=e.target.closest("button[data-w]");
  if(b)goWeek(+b.dataset.w);
});

document.addEventListener("click",e=>{
  if(popOpen&&!$("wkWrap").contains(e.target))closeWkPop();
});

$("prev").onclick=()=>{view=new Date(Date.UTC(view.getUTCFullYear(),view.getUTCMonth()-1,1));cal(false)};
$("next").onclick=()=>{view=new Date(Date.UTC(view.getUTCFullYear(),view.getUTCMonth()+1,1));cal(false)};
$("back").onclick=()=>go(today());
$("chg").onclick=()=>{closeWkPop();document.body.classList.remove("has");$("app").hidden=true;$("chg").hidden=true;$("lmp").focus()};

let sx=0,sy=0;
$("days").addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$("days").addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3)(dx<0?$("next"):$("prev")).click()},{passive:true});
$("days").addEventListener("keydown",e=>{const s={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7}[e.key];if(!s)return;const n=add(sel,s);if(!inW(n))return;e.preventDefault();go(n);const b=$("days").querySelector(".sel");b&&b.focus()});
$("bd").onclick=closeSheet;
$("pn").addEventListener("click",e=>{
  const k=e.target.closest(".ck");if(k)k.classList.toggle("on");
  if(e.target.closest("#x"))closeSheet();
  if(e.target.closest("#sc")){closeSheet();go(add(lmp,CARE[cur][2]));document.querySelector(".cal").scrollIntoView({behavior:"smooth",block:"center"})}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    if(!$("sheet").hidden)closeSheet();
    else if(popOpen)closeWkPop();
  }
});
window.addEventListener("resize",()=>{if(lmp)centerMon(displayMonthIdx(),true)});

const sv=st.g("bloom-lmp");
if(sv&&parse(sv)){$("lmp").value=sv;begin(sv,false)}
})();
</script>
</body>
</html>
